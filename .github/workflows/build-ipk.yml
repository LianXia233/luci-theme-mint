name: Build IPK packages

# Builds luci-theme-mint with the official OpenWrt SDK's ipk backend
# (CONFIG_USE_APK off). These are the packages for systems still on
# opkg/ipkg: OpenWrt 24.10 (and older point releases) and 23.05.
#
# Series that only ship the apk backend (25.12 and later) are NOT used
# here: the ipk fallback in build-package.sh (--allow-legacy) exists as a
# safety net only. Requesting an apk-only series would download and unpack
# a ~300 MB SDK just to be rejected, so the matrix asks for the newest
# series that really produce ipk, plus one older backend (23.05 still uses
# the dedicated package-ipkg.mk code path, worth covering).
#
# The theme has no src/, so the package is arch-independent (ipk records
# it as all) and identical for every target: exactly ONE build per OpenWrt
# version is required.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (default: nightly)'
        required: false
        default: nightly

permissions:
  contents: read

concurrency:
  group: ipk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  RELEASE_VERSION: ${{ inputs.release_version || 'nightly' }}

jobs:
  build:
    name: ipk · OpenWrt ${{ matrix.openwrt }} · ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt: '24.10'
            target: x86/64
            slug: x86_64
          - openwrt: '23.05'
            target: x86/64
            slug: x86_64

    steps:
      - name: Checkout theme sources
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates xz-utils zstd python3 || true
          # opkg is best effort: the install test falls back to a
          # structural payload check (ar x + tar) when it is missing.
          sudo apt-get install -y -qq opkg || echo "opkg not in apt - structural install test will be used"

      - name: Resolve OpenWrt SDK URL
        id: resolve
        run: |
          ./scripts/get-openwrt-sdk.sh \
            --version "${{ matrix.openwrt }}" \
            --target "${{ matrix.target }}" \
            --print

      # The SDK tarball is immutable per sha256, so it is safe to cache by
      # that digest and makes verify/re-run cycles fast. The download is
      # still re-verified against the official sha256sums.
      - name: Cache SDK tarball
        if: steps.resolve.outputs.tarball_sha256 != ''
        uses: actions/cache@v4
        with:
          path: build/sdk-cache
          key: openwrt-sdk-${{ matrix.openwrt }}-${{ matrix.target }}-${{ steps.resolve.outputs.tarball_sha256 }}

      - name: Build with the official OpenWrt SDK
        run: |
          ./scripts/build-package.sh \
            --version "${{ matrix.openwrt }}" \
            --target "${{ matrix.target }}" \
            --format ipk \
            --allow-legacy \
            --release-version "$RELEASE_VERSION" \
            --out dist \
            --workdir build \
            --cache-dir build/sdk-cache

      - name: Verify package metadata and payload
        run: ./scripts/verify-package.sh --dir dist --expect-arch all

      - name: Install test
        run: |
          fail=0
          for f in dist/*.ipk; do
            ./scripts/install-test.sh --file "$f" || fail=1
          done
          exit "$fail"

      - name: Show build info
        if: always()
        run: |
          for f in dist/*.buildinfo.txt; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
          done
          ls -l dist/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-mint-ipk-${{ matrix.openwrt }}-${{ matrix.slug }}
          path: |
            dist/*
            !dist/README.txt
          retention-days: 14
          if-no-files-found: error
