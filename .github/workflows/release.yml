name: Release

# Collects the artifacts of the Build packages workflow and publishes one
# release. Runs once per completed build; if the build failed or was for a
# non-publishable event the job exits without publishing.
#
# Only runs of the build workflow on the default branch (-> nightly) or on
# tags (-> version releases) are publishable. Runs for any other event -
# pull_request builds, manual dispatches on feature branches - are validated
# here and skipped.

on:
  workflow_run:
    workflows: ["Build packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. nightly, v1.0.0)'
        required: false
        default: 'nightly'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Never publish from pull_request-triggered builds - a PR must not create
    # (or update) a release. Tag-push builds (v*) and main-branch builds
    # (nightly) remain the only publishable events.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and build run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.release_tag }}"
            sha="$(git rev-parse HEAD)"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
            branch="${{ github.event.workflow_run.head_branch }}"
            default="${{ github.event.repository.default_branch }}"
            if [ "$branch" = "$default" ]; then
              tag="nightly"
            else
              tag="$branch"
            fi
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "build workflow failed - nothing to publish"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          run="$(gh api "repos/${repo}/actions/runs?head_sha=${sha}&per_page=100" \
            --jq '.workflow_runs[]
                  | select(.name=="Build packages" and .status=="completed" and .conclusion=="success")
                  | .id' | head -n1)"

          if [ -z "$run" ]; then
            echo "no successful Build packages run found for ${sha}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        if: steps.resolve.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.resolve.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: luci-theme-mint-packages
          path: release-assets
          merge-multiple: true

      - name: Re-verify every downloaded package
        if: steps.resolve.outputs.skip == 'false'
        run: |
          ls -l release-assets
          ./scripts/verify-package.sh --dir release-assets --expect-arch all

      - name: Build release notes
        if: steps.resolve.outputs.skip == 'false'
        run: |
          ./scripts/make-release-notes.sh \
            --assets release-assets \
            --tag "${{ steps.resolve.outputs.tag }}" \
            --out release-assets/RELEASE-NOTES.md
          cat release-assets/RELEASE-NOTES.md

      - name: Publish release
        if: steps.resolve.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.resolve.outputs.tag == 'nightly' && 'nightly' || steps.resolve.outputs.tag }}
          body_path: release-assets/RELEASE-NOTES.md
          prerelease: ${{ steps.resolve.outputs.tag == 'nightly' }}
          files: release-assets/*
          allowUpdates: true
          tag_overwrite: ${{ steps.resolve.outputs.tag == 'nightly' }}
