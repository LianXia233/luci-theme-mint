name: Build Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0, nightly)'
        required: false
        default: 'nightly'

permissions:
  contents: write

# Cancel superseded runs (e.g. a second push while the first is still building)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.release_tag || 'nightly') }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt SDK -> .ipk for stock OpenWrt
          - target: x86/64
            sdk_dir: x86/64
            sdk_source: openwrt
            suffix: x86_64-openwrt
          - target: mediatek/filogic
            sdk_dir: mediatek/filogic
            sdk_source: openwrt
            suffix: mediatek_filogic-openwrt
          # ImmortalWrt SDK -> .apk for ImmortalWrt (apk package manager)
          - target: x86/64
            sdk_dir: x86/64
            sdk_source: immortalwrt
            suffix: x86_64-immortalwrt
          - target: mediatek/filogic
            sdk_dir: mediatek/filogic
            sdk_source: immortalwrt
            suffix: mediatek_filogic-immortalwrt

    steps:
      - name: Checkout this repo (theme sources)
        uses: actions/checkout@v4

      # This package is pure data (htdocs / root / ucode templates / po, no
      # src/), so building the theme itself is trivial - but its dependency
      # chain (luci-base -> rpcd, ucode, lucihttp, curl, ...) is real C code
      # that must actually compile against the SDK's toolchain. The official
      # prebuilt SDK ships the cross-toolchain + host tools, so we build the
      # full dependency chain plus the package - no IGNORE_ERRORS, no skipped
      # dependencies. The SDK emits whatever format its build system is
      # configured for: current snapshot SDKs produce .apk (apk has been the
      # native format since the 24.10/25.12 cycle), older ones produced .ipk.
      # Old flow: git clone openwrt.git + feeds update/install -a +
      # make tools/install + make toolchain/install  ->  new flow: SDK.

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Download prebuilt SDK
        run: |
          set -e
          if [[ "${{ matrix.sdk_source }}" == "openwrt" ]]; then
            base="https://downloads.openwrt.org/snapshots/targets/${{ matrix.sdk_dir }}"
            pattern='openwrt-sdk-[^"<]+\.tar\.zst'
          else
            base="https://downloads.immortalwrt.org/snapshots/targets/${{ matrix.sdk_dir }}"
            pattern='immortalwrt-sdk-[^"<]+\.tar\.zst'
          fi
          sdk=$(curl -fsSL "$base/" | grep -oE "$pattern" | head -n1)
          [ -n "$sdk" ] || { echo "::error::SDK tarball not found under $base"; exit 1; }
          echo "Downloading SDK (${{ matrix.sdk_source }}): $sdk"
          curl -fsSLO "$base/$sdk" || { echo "::error::Failed to download $sdk"; exit 1; }
          echo "Extracting SDK ($(ls -lh "$sdk" | awk '{print $5}'))..."
          if tar --zstd -xf "$sdk" 2>&1; then
            echo "Successfully extracted with tar --zstd"
          else
            echo "tar --zstd failed, trying zstd + tar separately"
            zstd -d "$sdk" -o "${sdk%.zst}"
            tar -xf "${sdk%.zst}"
          fi
          echo "Renaming extracted directory..."
          ls -la | grep -E '(openwrt|immortalwrt)-sdk' || { echo "::error::No SDK directory found after extraction"; exit 1; }
          sdk_dir=$(ls -d {openwrt,immortalwrt}-sdk-*/ 2>/dev/null | head -n1)
          [ -n "$sdk_dir" ] || { echo "::error::No SDK directory found"; exit 1; }
          mv "$sdk_dir" sdk

      - name: Set up feeds (the SDK's own set + our theme)
        run: |
          cd sdk
          # Keep the feed set the SDK itself ships - do NOT overwrite
          # feeds.conf.default with a luci-only feed list. The SDK's "base"
          # feed is the pinned OpenWrt/ImmortalWrt core checkout (rpcd,
          # ucode, libubox, libubus, ...) and the packages feed provides
          # curl, lua, cgi-io, ... . luci-base's dependency chain needs all
          # of them; with a luci-only feed list the metadata scan silently
          # drops every unknown dependency ("WARNING: ... has a dependency on
          # 'curl', which does not exist") and the build dies inside
          # lucihttp / ucode-mod-html on missing lua.h / ucode/module.h.
          rm -f feeds.conf
          ./scripts/feeds update -a
          mkdir -p feeds/luci/themes/luci-theme-mint
          cp -a "$GITHUB_WORKSPACE"/theme/. feeds/luci/themes/luci-theme-mint/
          ./scripts/feeds install -a
          # feeds install cannot see directories injected after "update", so
          # link it in by hand - the same thing the buildroot does for
          # regular feed packages.
          mkdir -p package/feeds/luci
          ln -sf ../../../feeds/luci/themes/luci-theme-mint package/feeds/luci/luci-theme-mint
          ls -la package/feeds/luci/luci-theme-mint/Makefile || { echo "::error::Theme Makefile not found after symlink"; exit 1; }
          # The source packages carrying the dependency chain must be complete
          # now - fail loudly instead of degrading into missing-header errors
          # mid-build. (Subpackages such as libubus or ucode-mod-html have no
          # feed directory of their own; defconfig's resolved .config is the
          # authoritative check for those.)
          for dep in luci-base lucihttp rpcd ubus ucode lua curl libubox cgi-io; do
            [ -n "$(find package/feeds -maxdepth 2 -name "$dep" -print -quit)" ] \
              || { echo "::error::dependency package '$dep' missing after feeds install"; exit 1; }
          done

      - name: Configure
        run: |
          cd sdk
          # JS minification stays on: jsmin ships with luci-base/host.
          # CSS minification (csstidy) is deliberately disabled - it is not
          # needed for a correct package.
          echo "CONFIG_PACKAGE_luci-theme-mint=m" >> .config
          echo "CONFIG_LUCI_JSMIN=y" >> .config
          echo "# CONFIG_LUCI_CSSTIDY is not set" >> .config
          make defconfig
          grep -q "CONFIG_PACKAGE_luci-theme-mint=m" .config || {
            echo "::error::theme package not selectable"; exit 1;
          }
          # The full runtime dependency chain must have survived defconfig -
          # a missing feed makes the metadata scan silently drop deps
          # ("has a dependency on 'curl', which does not exist").
          for dep in luci-base curl rpcd ucode ucode-mod-html ucode-mod-uci \
                     liblucihttp-ucode libubus libubox cgi-io; do
            grep -qE "^CONFIG_PACKAGE_${dep}=[my]" .config \
              || { echo "::error::dependency '$dep' missing from .config - SDK feed set incomplete"; exit 1; }
          done

      - name: Build host tools (po2lmo/jsmin)
        run: |
          cd sdk
          make package/feeds/luci/luci-base/host/compile V=s -j$(nproc)

      - name: Build theme package (full dependency chain)
        run: |
          cd sdk
          # No IGNORE_ERRORS: the theme and every package it depends on must
          # build for real. A failure here is a failure of the build.
          make package/feeds/luci/luci-theme-mint/compile V=s -j$(nproc)

      - name: Collect artifacts
        run: |
          cd sdk
          mkdir -p "$GITHUB_WORKSPACE"/artifacts
          find bin/packages -name 'luci-theme-mint*' -exec cp {} "$GITHUB_WORKSPACE"/artifacts/ \;

          # Rename artifacts with version + SDK source suffix so the release
          # page makes the OpenWrt vs ImmortalWrt provenance obvious, and so
          # all matrix outputs can coexist without filename collisions.
          # (Previously the rename only happened for non-nightly versions, so
          # every nightly job produced the same "luci-theme-mint-0.*" name
          # and they overwrote each other, leaving a single asset on the
          # release.)
          cd "$GITHUB_WORKSPACE"/artifacts
          for file in *; do
            ext="${file##*.}"
            base="${file%.*}"
            new_name="${base}-${{ env.VERSION }}-${{ matrix.suffix }}.${ext}"
            mv "$file" "$new_name"
          done
          ls -la "$GITHUB_WORKSPACE"/artifacts

      - name: Upload to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-mint-${{ matrix.suffix }}
          path: artifacts/*

      - name: Determine release info
        id: release_info
        run: |
          if [[ "${{ env.VERSION }}" == "nightly" ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_name=${{ env.VERSION }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
          files: artifacts/*
          allowUpdates: ${{ env.VERSION == 'nightly' }}
          tag_overwrite: ${{ env.VERSION == 'nightly' }}
